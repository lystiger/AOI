[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoi"
version = "0.1.0"
description = "AOI logging and monitoring pipeline scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=11.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
