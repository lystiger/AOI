apiVersion: 1

datasources:
  - name: Loki
    uid: grafana-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      # Grafana-managed alerting is used (provisioned rules); Loki does not serve its own
      # ruler API here, so disable the probe that otherwise shows a red "unable to fetch
      # alert rules" banner on the Alerting page.
      manageAlerts: false
