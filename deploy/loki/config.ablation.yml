# Loki config for the label-design ablation ONLY. Identical to deploy/loki/config.yml
# except the per-tenant limits are lifted, so ingestion is never the bottleneck and
# the high-cardinality (pcb_id-as-label) arm can fully ingest at large board counts.
# The default deployment keeps the standard 5000-stream limit; under that limit the
# label arm saturates and drops data (see docs/experiments/label_ablation_defaultlimit.json).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /tmp/loki/chunks

limits_config:
  allow_structured_metadata: false
  volume_enabled: true
  max_global_streams_per_user: 0      # 0 = unlimited (default is 5000)
  max_streams_per_user: 0
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 512MB
  per_stream_rate_limit_burst: 1024MB
  reject_old_samples: false

analytics:
  reporting_enabled: false
